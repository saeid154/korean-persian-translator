<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Korean ⇄ Persian Offline Translator</title>

<!-- Makes "Add to Home Screen" open full-screen like a native app on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="lang-bar">
  <span id="srcLangLabel" class="lang-label">Korean</span>
  <button id="swapBtn" class="swap-btn" aria-label="Swap direction" type="button">⇄</button>
  <span id="tgtLangLabel" class="lang-label">Persian</span>
</header>

<p id="status" class="status">Loading on-device models the first time you use this needs Wi-Fi and can take a few minutes.</p>
<div id="progressWrap" class="progress-wrap" hidden>
  <div id="progressBar" class="progress-bar"></div>
</div>

<main>
  <section class="live-panel">
    <p id="sourceLive" class="live-text src"></p>
    <p id="targetLive" class="live-text dst"></p>
  </section>

  <section id="transcript" class="transcript" aria-live="polite"></section>
</main>

<footer>
  <button id="micBtn" class="mic-btn" type="button" aria-label="Start listening" disabled>🎤</button>
</footer>

<script src="app.js" type="module"></script>
</body>
</html>
